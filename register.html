<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - ShopEase</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header id="main-header">
    <nav class="navbar">
      <a href="index.html" class="logo" id="header-logo">
        Shop<span>Ease</span>
      </a>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation menu">☰</button>

      <!-- Nav Links -->
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" id="nav-home">Home</a></li>
        <li><a href="products.html" id="nav-products">Products</a></li>
        <li>
          <a href="cart.html" id="nav-cart">
            Cart 🛒 <span class="cart-badge" id="cart-count-badge">0</span>
          </a>
        </li>
        <li id="user-nav-area">
          <a href="login.html" class="btn btn-login-nav active" id="nav-login">Login</a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="main-register-content">

    <div class="auth-container">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Join ShopEase for fast checkout, order tracking, and exclusive discounts</p>
      </div>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-fullname">Full Name *</label>
          <input type="text" id="reg-fullname" placeholder="e.g. Rahul Sharma" required />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" placeholder="e.g. rahul@example.com" required />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-phone">Phone Number *</label>
          <input type="tel" id="reg-phone" placeholder="e.g. 9876543210" required />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="reg-password">Password (min 6 characters) *</label>
          <input type="password" id="reg-password" placeholder="Create a strong password" required />
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="reg-confirm-password">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" placeholder="Re-enter password" required />
        </div>

        <button type="submit" class="btn btn-accent btn-block" id="btn-register-submit">
          Create Account 🎉
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" id="link-to-login">Login Here</a>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer id="main-footer">
    <div class="footer-bottom">
      © 2026 ShopEase. All Rights Reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="cart.js"></script>
  <script src="auth.js"></script>
  <script src="common.js"></script>
</body>
</html>
